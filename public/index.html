<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeekFon Society</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;font-family:'Montserrat',sans-serif;background:#020c0a;color:#e8e8e8;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
:focus-visible{outline:3px solid #F69820;outline-offset:3px;}
a{color:inherit;text-decoration:none;}
button{font-family:'Montserrat',sans-serif;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* AURORA */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 9% 6%,rgba(255,255,255,.55) 0%,transparent 100%),radial-gradient(1px 1px at 24% 12%,rgba(255,255,255,.35) 0%,transparent 100%),radial-gradient(1px 1px at 44% 4%,rgba(255,255,255,.48) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 76% 7%,rgba(255,255,255,.52) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 18% 4%,rgba(255,255,255,.65) 0%,transparent 100%);}
.a{position:absolute;border-radius:50%;filter:blur(90px);}
.a1{width:85vw;height:48vh;top:-20vh;left:4vw;background:radial-gradient(ellipse at center,rgba(0,215,95,.22) 0%,transparent 70%);animation:d1 18s ease-in-out infinite alternate;}
.a2{width:62vw;height:40vh;top:-14vh;right:-6vw;background:radial-gradient(ellipse at center,rgba(0,155,255,.16) 0%,transparent 70%);animation:d2 24s ease-in-out infinite alternate;}
.a3{width:52vw;height:34vh;top:0;left:24vw;background:radial-gradient(ellipse at center,rgba(120,0,255,.11) 0%,transparent 70%);animation:d3 20s ease-in-out infinite alternate;}
.aurora-ground{position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top,rgba(2,12,10,.97) 0%,transparent 100%);}
@keyframes d1{from{transform:translate(0,0)}to{transform:translate(4vw,5vh)}}
@keyframes d2{from{transform:translate(0,0)}to{transform:translate(-5vw,3vh)}}
@keyframes d3{from{transform:translate(0,0)}to{transform:translate(3vw,-4vh) rotate(7deg)}}


/* PAGE */
.page{position:relative;z-index:1;height:100vh;padding-top:68px;display:flex;align-items:center;justify-content:center;}
.layout{display:flex;align-items:center;justify-content:center;gap:clamp(32px,5vw,80px);width:100%;max-width:1280px;padding:0 40px;height:100%;}

/* PHONE BEZEL (left col) */
.phone-col{display:flex;flex-direction:column;align-items:center;gap:14px;flex-shrink:0;}
.phone-bezel{--ph:min(88vh,680px);--pw:calc(var(--ph)*0.495);width:var(--pw);height:var(--ph);background:rgba(18,20,20,.92);border-radius:min(46px,calc(var(--pw)*0.14));padding:min(13px,calc(var(--ph)*0.018));box-shadow:0 0 0 1px rgba(255,255,255,.07),0 0 0 3px rgba(0,0,0,.55),0 30px 90px rgba(0,0,0,.85),0 0 60px rgba(0,200,100,.05);position:relative;backdrop-filter:blur(4px);}
.phone-notch{width:min(98px,calc(var(--pw)*0.34));height:min(20px,calc(var(--ph)*0.029));background:#0a0c0b;border-radius:0 0 14px 14px;position:absolute;top:min(13px,calc(var(--ph)*0.018));left:50%;transform:translateX(-50%);z-index:4;}
.phone-screen{width:100%;height:100%;background:#080808;border-radius:min(36px,calc(var(--pw)*0.11));overflow:hidden;position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:26px;}
.phone-screen iframe{flex-shrink:0;width:375px;height:820px;border:none;display:block;transform-origin:top center;transform:scale(calc((var(--pw) - 26px) / 375));}
.pb{position:absolute;background:rgba(255,255,255,.07);border-radius:2px;}
.pb.r{right:-3px;top:16%;width:3px;height:12%;border-radius:0 2px 2px 0;}
.pb.l1{left:-3px;top:13%;width:3px;height:6%;border-radius:2px 0 0 2px;}
.pb.l2{left:-3px;top:21%;width:3px;height:10%;border-radius:2px 0 0 2px;}
.pb.l3{left:-3px;top:34%;width:3px;height:10%;border-radius:2px 0 0 2px;}
.phone-home{position:absolute;bottom:min(14px,2.5%);left:50%;transform:translateX(-50%);width:30%;height:4px;background:rgba(255,255,255,.12);border-radius:100px;z-index:4;}

/* PHONE MODE TOGGLE */
.phone-mode-toggle{display:flex;gap:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:100px;padding:4px;align-self:center;}
.phone-mode-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:8px 22px;border-radius:100px;font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.38);transition:all .18s;}
.phone-mode-btn.active{background:rgba(246,152,32,.14);color:#F69820;}
.phone-mode-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
.phone-mode-btn:focus-visible{outline:3px solid #F69820;outline-offset:3px;}

/* RIGHT COL - HERO CONTENT */
.hero-col{display:flex;flex-direction:column;justify-content:center;gap:0;flex-shrink:0;max-width:480px;width:clamp(300px,40vw,480px);}

/* Logo */
.hero-logo-wrap{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.hero-logo{width:44px;height:44px;border-radius:10px;object-fit:contain;flex-shrink:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
.hero-logo-text{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.18em;color:rgba(255,255,255,.45);}

/* Wordmark */
.hero-eyebrow{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.32em;color:rgba(246,152,32,.7);margin-bottom:16px;}
.hero-wordmark{font-size:clamp(48px,5.5vw,74px);font-weight:900;text-transform:uppercase;letter-spacing:-.025em;color:#fff;line-height:.9;}
.hero-wordmark em{color:#F69820;font-style:normal;}
.hero-sub{font-size:clamp(10px,1vw,13px);font-weight:400;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:12px;margin-left:.5em;}

/* Divider */
.hero-divider{width:36px;height:1px;background:rgba(246,152,32,.4);margin:28px 0;}

/* Tagline */
.hero-tagline{font-size:15px;font-weight:400;color:rgba(255,255,255,.6);line-height:1.65;margin-bottom:28px;max-width:360px;}
.hero-tagline strong{font-weight:800;color:#fff;}

/* CTAs */
.hero-ctas{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:28px;}
.cta-primary{background:#F69820;color:#020c0a;border:none;border-radius:100px;padding:14px 36px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.16em;cursor:pointer;transition:background .15s,transform .15s;box-shadow:0 0 28px rgba(246,152,32,.2);}
.cta-primary:hover{background:#e08818;transform:translateY(-2px);}
.cta-primary:focus-visible{outline:3px solid #F69820;outline-offset:3px;}
.cta-secondary{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.18);border-radius:100px;padding:14px 28px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;cursor:pointer;transition:border-color .15s,color .15s,transform .15s;text-decoration:none;}
.cta-secondary:hover{border-color:#F69820;color:#F69820;transform:translateY(-2px);}
.cta-secondary:focus-visible{outline:3px solid #F69820;outline-offset:3px;}

/* Membership pill */
.mem-pill{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 18px;margin-bottom:28px;}
.mem-tier{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 12px;border-right:1px solid rgba(255,255,255,.08);}
.mem-tier:last-child{border-right:none;}
.mem-price{font-size:16px;font-weight:900;color:#fff;letter-spacing:-.01em;}
.mem-label{font-size:7px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.55);}
.mem-sep{width:1px;height:28px;background:rgba(255,255,255,.08);}

.app-badges{display:flex;align-items:center;gap:10px;margin-top:6px;}
.app-badge{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;text-decoration:none;color:#fff;transition:background .15s,border-color .15s;}
.app-badge:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.24);}
.app-badge:focus-visible{outline:3px solid #F69820;outline-offset:3px;}
.app-badge-icon{width:18px;height:18px;flex-shrink:0;fill:rgba(255,255,255,.85);}
.app-badge-text{display:flex;flex-direction:column;line-height:1.2;}
.app-badge-sub{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.5);}
.app-badge-name{font-size:11px;font-weight:900;color:#fff;letter-spacing:.01em;}

/* Live radio card */
.live-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:10px 14px 10px 10px;cursor:pointer;text-decoration:none;color:inherit;transition:border-color .18s,background .18s;}
.live-card:hover{border-color:rgba(76,175,80,.45);background:rgba(76,175,80,.05);}
.live-card:focus-visible{outline:3px solid #F69820;outline-offset:3px;}
.live-card-art{width:44px;height:44px;border-radius:10px;overflow:hidden;background:#111;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.live-card-art img{width:100%;height:100%;object-fit:cover;display:block;}
.live-card-art-ph{font-size:20px;}
.live-card-info{flex:1;min-width:0;}
.live-card-title{font-size:12px;font-weight:800;color:#fff;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.live-card-sub{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.45);margin-top:2px;}
.live-pill{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4caf50;animation:pulse 2s ease infinite;flex-shrink:0;}
.live-text{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:#4caf50;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live-card.playing{border-color:rgba(76,175,80,.5);background:rgba(76,175,80,.07);}
.live-card.playing .live-dot{animation:pulse .9s ease infinite;}
.live-play-icon{width:18px;height:18px;flex-shrink:0;fill:rgba(255,255,255,.6);transition:fill .15s;}
.live-card:hover .live-play-icon{fill:#fff;}
.live-card.playing .live-play-icon{fill:#4caf50;}

/* MOBILE */
@media(max-width:820px){
  html,body{height:auto;overflow-y:auto;}
  .page{height:auto;min-height:100vh;padding:72px 0 60px;}
  .layout{flex-direction:column;align-items:center;gap:40px;height:auto;padding:0 20px;}
  .hero-col{order:1;max-width:100%;width:100%;text-align:center;align-items:center;}
  .hero-ctas{justify-content:center;}
  .mem-pill{width:100%;justify-content:center;}
  .roster-strip{justify-content:center;}
  .phone-col{order:2;}
  .phone-bezel{--ph:560px;--pw:calc(var(--ph)*0.495);}
}
</style>
</head>
<body>
<script src="/nav.js"></script>

<div class="aurora" aria-hidden="true">
  <div class="stars"></div><div class="a a1"></div><div class="a a2"></div><div class="a a3"></div>
  <div class="aurora-ground"></div>
</div>


<h1 class="sr-only">GeekFon Society -- Independent Artist Community</h1>

<main class="page" id="main-content">
  <div class="layout">

    <!-- LEFT: PHONE BEZEL -->
    <div class="phone-col">
      <div class="phone-bezel">
        <div class="phone-notch" aria-hidden="true"></div>
        <div class="pb r" aria-hidden="true"></div>
        <div class="pb l1" aria-hidden="true"></div>
        <div class="pb l2" aria-hidden="true"></div>
        <div class="pb l3" aria-hidden="true"></div>
        <div class="phone-screen">
          <iframe
            src="gfs-phone-content.html"
            id="phoneFrame"
            title="GeekFon Society -- music and chat"
          ></iframe>
        </div>
        <div class="phone-home" aria-hidden="true"></div>
      </div>

      <!-- MODE TOGGLE -->
      <div class="phone-mode-toggle" role="group" aria-label="Phone view">
        <button class="phone-mode-btn active" id="btnViewMusic" onclick="setPhoneView('music')" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Music
        </button>
        <button class="phone-mode-btn" id="btnViewChat" onclick="setPhoneView('chat')" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Chat
        </button>
      </div>
    </div>

    <!-- RIGHT: HERO CONTENT -->
    <div class="hero-col">

      <!-- Eyebrow + Wordmark -->
      <div class="hero-eyebrow">LESARUSS Universe</div>
      <div class="hero-wordmark" aria-label="GeekFon Society">Geek<em>Fon</em></div>
      <div class="hero-sub">Society</div>

      <!-- Divider -->
      <div class="hero-divider" aria-hidden="true"></div>

      <!-- Tagline -->
      <p class="hero-tagline">
        A closed group for <strong>original artists</strong> who build in public. Stream free. Join the chat. Get your Passport.
      </p>

      <!-- CTAs -->
      <div class="hero-ctas">
        <button class="cta-primary" onclick="window.open('https://lesaruss.ai/geekfon','_blank')">
          Get Your Passport
        </button>
        <a class="cta-secondary" href="/roster">
          Listen Free
        </a>
      </div>

      <!-- Live radio card -->
      <button class="live-card" id="liveCard" onclick="toggleRadio()" style="margin-bottom:24px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);width:100%;text-align:left;font-family:inherit;" aria-label="GeekFon Radio -- tap to stream">
        <div class="live-card-art">
          <img src="" alt="Lord Zorlot" onerror="this.style.display='none';this.nextElementSibling.style.display=''">
          <span class="live-card-art-ph" style="display:none" aria-hidden="true">&#x1F4FB;</span>
        </div>
        <div class="live-card-info">
          <div class="live-card-title">GeekFon Radio</div>
          <div class="live-card-sub" id="liveCardSub">Tap to stream</div>
        </div>
        <div class="live-pill">
          <div class="live-dot" aria-hidden="true"></div>
          <span class="live-text">Live</span>
        </div>
        <svg class="live-play-icon" id="livePlayIcon" viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <audio id="radioAudio" preload="none" src="http://2.24.99.251/listen/geekfon_radio/radio.mp3"></audio>



      <!-- App store badges -->
      <div class="app-badges">
        <a href="#" class="app-badge" aria-label="Download on the App Store">
          <svg class="app-badge-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          <div class="app-badge-text">
            <span class="app-badge-sub">Download on the</span>
            <span class="app-badge-name">App Store</span>
          </div>
        </a>
        <a href="#" class="app-badge" aria-label="Get it on Google Play">
          <svg class="app-badge-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.18 23.76c.3.17.64.22.99.14l11.65-11.65L12 9.43 3.18 23.76zm16.3-12.2L16.9 9.97 5.26 3.33c-.43-.25-.9-.25-1.3-.05l10.97 10.97 4.55-2.69zm.95 1.64l-3.82-2.27-3.37 3.37 3.37 3.37 3.84-2.27c1.1-.65 1.1-1.55-.02-2.2zm-17.6 9.2c-.08-.18-.13-.38-.13-.6V2.2c0-.22.05-.42.13-.6L12 12 2.83 22.4z"/></svg>
          <div class="app-badge-text">
            <span class="app-badge-sub">Get it on</span>
            <span class="app-badge-name">Google Play</span>
          </div>
        </a>
      </div>

    </div><!-- /hero-col -->

  </div>
</main>

<script>
/* PHONE IFRAME MESSENGER */
function getPhoneIframe() {
  return document.getElementById('phoneFrame');
}
function sendToPhone(msg) {
  var f = getPhoneIframe();
  if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*');
}

/* PHONE VIEW TOGGLE */
function setPhoneView(v) {
  sendToPhone({ view: v });
  ['Music','Chat'].forEach(function(x) {
    var btn = document.getElementById('btnView' + x);
    var active = x.toLowerCase() === v;
    if (btn) { btn.classList.toggle('active', active); btn.setAttribute('aria-pressed', String(active)); }
  });
  document.querySelectorAll('.nav-pill').forEach(function(p, i) {
    p.classList.toggle('active', (i === 0 && v === 'music') || (i === 1 && v === 'chat'));
  });
}

/* LOGIN TOGGLE */
var _loggedIn = false;
function toggleLogin() {
  _loggedIn = !_loggedIn;
  sendToPhone({ loggedIn: _loggedIn });
}
document.addEventListener('gfs:login-toggle', toggleLogin);

/* LIVE RADIO PLAYER */
var _radioPlaying = false;
var _radioAudio = null;
function toggleRadio() {
  if (!_radioAudio) _radioAudio = document.getElementById('radioAudio');
  var card = document.getElementById('liveCard');
  var sub  = document.getElementById('liveCardSub');
  var icon = document.getElementById('livePlayIcon');
  if (_radioPlaying) {
    _radioAudio.pause();
    _radioPlaying = false;
    card.classList.remove('playing');
    card.setAttribute('aria-label', 'GeekFon Radio -- tap to stream');
    sub.textContent = 'Tap to stream';
    icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
  } else {
    _radioAudio.play().catch(function(){});
    _radioPlaying = true;
    card.classList.add('playing');
    card.setAttribute('aria-label', 'GeekFon Radio -- playing, tap to pause');
    sub.textContent = 'Playing now';
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  }
}
/* Handle stream ending or error */
document.addEventListener('DOMContentLoaded', function() {
  var a = document.getElementById('radioAudio');
  if (a) {
    a.addEventListener('error', function() {
      _radioPlaying = false;
      var card = document.getElementById('liveCard');
      var sub  = document.getElementById('liveCardSub');
      var icon = document.getElementById('livePlayIcon');
      if (card) card.classList.remove('playing');
      if (sub)  sub.textContent = 'Tap to stream';
      if (icon) icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    });
  }
});

</script>
<script src="/footer.js"></script>
</body>
</html>
