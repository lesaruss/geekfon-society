<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekFon Society</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: #020c0a;
      color: #e8e8e8;
    }

    /* ============================================================
       NORTHERN LIGHTS
    ============================================================ */
    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 9%  6%,  rgba(255,255,255,0.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 24% 12%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 44%  4%, rgba(255,255,255,0.48) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.30) 0%, transparent 100%),
        radial-gradient(1px 1px at 76%  7%, rgba(255,255,255,0.52) 0%, transparent 100%),
        radial-gradient(1px 1px at 90%  3%, rgba(255,255,255,0.42) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.28) 0%, transparent 100%),
        radial-gradient(1px 1px at 38% 17%, rgba(255,255,255,0.22) 0%, transparent 100%),
        radial-gradient(1px 1px at 56% 22%, rgba(255,255,255,0.32) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 18% 4%, rgba(255,255,255,0.65) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 66%  2%, rgba(255,255,255,0.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 83% 15%, rgba(200,220,255,0.38) 0%, transparent 100%);
    }
    .a { position: absolute; border-radius: 50%; filter: blur(90px); }
    .a1 {
      width: 85vw; height: 48vh; top: -20vh; left: 4vw;
      background: radial-gradient(ellipse at center, rgba(0,215,95,0.24) 0%, transparent 70%);
      animation: d1 18s ease-in-out infinite alternate;
    }
    .a2 {
      width: 62vw; height: 40vh; top: -14vh; right: -6vw;
      background: radial-gradient(ellipse at center, rgba(0,155,255,0.18) 0%, transparent 70%);
      animation: d2 24s ease-in-out infinite alternate;
    }
    .a3 {
      width: 52vw; height: 34vh; top: 0vh; left: 24vw;
      background: radial-gradient(ellipse at center, rgba(120,0,255,0.13) 0%, transparent 70%);
      animation: d3 20s ease-in-out infinite alternate;
    }
    .a4 {
      width: 40vw; height: 24vh; top: -8vh; left: 46vw;
      background: radial-gradient(ellipse at center, rgba(0,255,185,0.15) 0%, transparent 70%);
      animation: d4 28s ease-in-out infinite alternate;
    }
    .a5 {
      width: 28vw; height: 20vh; top: 4vh; left: 62vw;
      background: radial-gradient(ellipse at center, rgba(190,70,255,0.09) 0%, transparent 70%);
      animation: d5 22s ease-in-out infinite alternate;
    }
    .aurora-ground {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 60%;
      background: linear-gradient(to top, rgba(2,12,10,0.97) 0%, transparent 100%);
    }
    @keyframes d1 { from{transform:translate(0,0) scaleX(1)}   to{transform:translate(4vw,5vh) scaleX(1.1)} }
    @keyframes d2 { from{transform:translate(0,0) scaleY(1)}   to{transform:translate(-5vw,3vh) scaleY(1.18)} }
    @keyframes d3 { from{transform:translate(0,0) rotate(0)}   to{transform:translate(3vw,-4vh) rotate(7deg)} }
    @keyframes d4 { from{transform:translate(0,0)}             to{transform:translate(-4vw,6vh)} }
    @keyframes d5 { from{transform:translate(0,0) scale(1)}    to{transform:translate(5vw,-5vh) scale(1.3)} }

    /* ============================================================
       PAGE
    ============================================================ */
    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Desktop: side by side, fills full viewport height */
    .layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(32px, 5vw, 72px);
      width: 100%;
      max-width: 1280px;
      padding: 0 40px;
      height: 100%;
    }

    /* ============================================================
       PHONE COLUMN
    ============================================================ */
    .phone-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    /* Phone bezel â sized to fill ~88% of viewport height */
    .phone-bezel {
      --ph: min(88vh, 680px);
      --pw: calc(var(--ph) * 0.495);
      width: var(--pw);
      height: var(--ph);
      background: rgba(18,20,20,0.92);
      border-radius: min(46px, calc(var(--pw) * 0.14));
      padding: min(13px, calc(var(--ph) * 0.018));
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 0 0 3px rgba(0,0,0,0.55),
        0 30px 90px rgba(0,0,0,0.85),
        0 0 60px rgba(0,200,100,0.05);
      position: relative;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      backdrop-filter: blur(4px);
    }
    .phone-bezel:hover {
      transform: translateY(-3px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.1),
        0 0 0 3px rgba(0,0,0,0.55),
        0 40px 100px rgba(0,0,0,0.9),
        0 0 80px rgba(0,200,100,0.08);
    }

    /* Notch */
    .phone-notch {
      width: min(98px, calc(var(--pw) * 0.34));
      height: min(20px, calc(var(--ph) * 0.029));
      background: #0a0c0b;
      border-radius: 0 0 14px 14px;
      position: absolute;
      top: min(13px, calc(var(--ph) * 0.018));
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
    }

    /* Screen area */
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #080808;
      border-radius: min(36px, calc(var(--pw) * 0.11));
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 26px; /* clears the notch visually */
    }

    /* Iframe scaled to fit â centered via flex + top-center transform origin */
    .phone-screen iframe {
      flex-shrink: 0;
      width: 375px;
      height: 820px;
      border: none;
      display: block;
      transform-origin: top center;
      transform: scale(calc((var(--pw) - 26px) / 375));
      pointer-events: none; /* clicks pass through to trigger fullscreen */
      user-select: none;
    }

    /* Side buttons */
    .pb { position: absolute; background: rgba(255,255,255,0.07); border-radius: 2px; }
    .pb.r  { right:-3px; top:16%; width:3px; height:12%; border-radius:0 2px 2px 0; }
    .pb.l1 { left:-3px;  top:13%; width:3px; height: 6%; border-radius:2px 0 0 2px; }
    .pb.l2 { left:-3px;  top:21%; width:3px; height:10%; border-radius:2px 0 0 2px; }
    .pb.l3 { left:-3px;  top:34%; width:3px; height:10%; border-radius:2px 0 0 2px; }

    /* Home indicator */
    .phone-home {
      position: absolute;
      bottom: min(14px, 2.5%);
      left: 50%; transform: translateX(-50%);
      width: 30%;
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 100px;
      z-index: 4;
    }

    /* Tap hint */
    .tap-hint {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tap-hint svg { opacity: 0.6; }

    /* ============================================================
       HERO CIRCLE COLUMN
    ============================================================ */
    .hero-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      max-width: 520px;
      gap: 28px;
    }

    /* Live badge */
    .hero-live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(100,220,110,0.75);
    }
    .live-dot {
      width: 7px; height: 7px;
      background: #4caf50;
      border-radius: 50%;
      animation: pdot 1.5s ease-in-out infinite;
    }
    @keyframes pdot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.7)} }

    /* Circle */
    .hero-circle-wrap {
      position: relative;
      /* scales between screens */
      width: min(400px, min(44vw, 72vh));
      height: min(400px, min(44vw, 72vh));
    }
    /* Soft aurora glow ring â no hard border */
    .hero-circle-wrap::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(0,215,95,0.18), 0 0 100px rgba(0,155,255,0.1);
      pointer-events: none;
    }
    .hero-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
    }
    .hero-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* full logo â nothing cut off */
      object-position: center;
      display: block;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2,12,10,0.45);
      border-radius: 50%;
    }
    .hero-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 15%;
    }
    .hero-title {
      font-size: clamp(34px, 9vw, 56px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      text-shadow:
        0 0 30px rgba(0,0,0,1),
        0 0 70px rgba(0,0,0,0.9),
        0 2px 14px rgba(0,0,0,1);
    }
    .hero-fon { transition: color 0.7s ease; }
    .hero-tagline {
      font-size: clamp(8px, 1.2vw, 11px);
      font-weight: 200;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      text-align: center;
      text-shadow: 0 1px 8px rgba(0,0,0,1);
    }

    /* Sub text + CTAs */
    .hero-sub {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .hero-sub-text {
      font-size: 12px;
      font-weight: 200;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.72);
      line-height: 1.8;
      max-width: 320px;
    }
    .hero-cta-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-enter {
      background: #F69820;
      color: #fff;
      border: none;
      border-radius: 100px;
      padding: 13px 30px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-enter:hover { background: #e08818; transform: translateY(-1px); }
    .btn-enter:focus { outline: 3px solid #F69820; outline-offset: 3px; }
    .btn-listen {
      background: transparent;
      color: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 100px;
      padding: 13px 30px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-listen:hover { border-color: rgba(255,255,255,0.35); color: #fff; }
    .btn-listen:focus { outline: 3px solid #F69820; outline-offset: 3px; }

    /* App download buttons */
    .app-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .app-dl-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      padding: 10px 16px;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .app-dl-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
    .app-dl-btn:focus { outline: 3px solid #F69820; outline-offset: 3px; }
    .app-dl-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .app-dl-text { display: flex; flex-direction: column; align-items: flex-start; }
    .app-dl-sub { font-size: 8px; font-weight: 400; color: rgba(255,255,255,0.55); letter-spacing: 0.04em; line-height: 1; }
    .app-dl-name { font-size: 12px; font-weight: 800; letter-spacing: 0.01em; line-height: 1.3; }

    /* ============================================================
       FULLSCREEN OVERLAY
    ============================================================ */

    /* ============================================================
       MOBILE LAYOUT
    ============================================================ */
    @media (max-width: 820px) {
      html, body { overflow-y: auto; }
      .page { height: auto; min-height: 100vh; padding: 40px 0 60px; }
      .layout {
        flex-direction: column;
        gap: 36px;
        height: auto;
        padding: 0 20px;
      }
      .hero-col { order: 1; max-width: 360px; width: 100%; }
      .phone-col { order: 2; }
      .phone-bezel {
        --ph: 580px;
        --pw: calc(var(--ph) * 0.495);
      }
      .hero-circle-wrap { width: min(300px, 80vw); height: min(300px, 80vw); }
    }
  </style>
</head>
<body>

  <!-- NORTHERN LIGHTS -->
  <div class="aurora" aria-hidden="true">
    <div class="stars"></div>
    <div class="a a1"></div>
    <div class="a a2"></div>
    <div class="a a3"></div>
    <div class="a a4"></div>
    <div class="a a5"></div>
    <div class="aurora-ground"></div>
  </div>

  <!-- PAGE -->
  <div class="page">
    <div class="layout">

      <!-- LEFT: PHONE -->
      <div class="phone-col">
        <div
          class="phone-bezel"
          id="phoneBez"
          role="button"
          tabindex="0"
          aria-label="Tap to read GeekFon Society chat"
          title="Tap to read"
        >
          <div class="phone-notch" aria-hidden="true"></div>
          <div class="pb r"  aria-hidden="true"></div>
          <div class="pb l1" aria-hidden="true"></div>
          <div class="pb l2" aria-hidden="true"></div>
          <div class="pb l3" aria-hidden="true"></div>
          <div class="phone-screen">
            <iframe
              src="geekfon-homepage-v3.html"
              title="GeekFon chat preview"
              aria-hidden="true"
              tabindex="-1"
            ></iframe>
          </div>
          <div class="phone-home" aria-hidden="true"></div>
        </div>
        <div class="tap-hint" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <rect x="1" y="1" width="10" height="10" rx="2.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M4 6h4M6 4v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          Tap to read
        </div>
      </div>

      <!-- RIGHT: HERO CIRCLE -->
      <div class="hero-col">

        <div class="hero-live" aria-label="Live feed">
          <span class="live-dot" aria-hidden="true"></span>Live Feed
        </div>

        <div class="hero-circle-wrap">
          <div class="hero-circle">
            <img
              class="hero-logo-img"
              src="geekfon-logo.png"
              alt="GeekFon Society logo"
              onerror="this.style.display='none'"
            >
            <div class="hero-overlay" aria-hidden="true"></div>
          </div>
          <div class="hero-text" aria-hidden="true">
            <div class="hero-title">Geek<span class="hero-fon" id="heroFon">Fon</span></div>
            <div class="hero-tagline">The Society Chat</div>
          </div>
          <h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">GeekFon Society â The Society Chat</h1>
        </div>

        <div class="hero-sub">
          <p class="hero-sub-text">
            A global community of artists, creators, and music fans. The conversation never stops.
          </p>
          <div class="app-row">
            <a href="#" class="app-dl-btn" aria-label="Download on the App Store">
              <svg class="app-dl-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98l-.09.06c-.22.14-2.18 1.27-2.16 3.8.03 3.02 2.65 4.03 2.68 4.04l-.07.28zM13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
              <div class="app-dl-text">
                <span class="app-dl-sub">Download on the</span>
                <span class="app-dl-name">App Store</span>
              </div>
            </a>
            <a href="#" class="app-dl-btn" aria-label="Get it on Google Play">
              <svg class="app-dl-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.954 11.549l2.152-2.151-9.26-5.197 7.108 7.348zm-3.246 1.95L7.29 16.3c.61.344 9.418 5.28 9.418 5.28l-7.001-8.08zM3.08 5.017a1.27 1.27 0 0 0-.08.445v13.073c0 .155.025.298.08.445l7.01-6.98-7.01-6.983zm15.855 6.255-2.161-1.21-2.37 2.37 2.37 2.37 2.161-1.21a1.27 1.27 0 0 0 0-2.32z"/></svg>
              <div class="app-dl-text">
                <span class="app-dl-sub">Get it on</span>
                <span class="app-dl-name">Google Play</span>
              </div>
            </a>
          </div>
          <div class="hero-cta-row">
            <a href="geekfon-homepage-v3.html" target="_blank" rel="noopener" class="btn-enter" role="button" aria-label="Enter GeekFon Society">Enter GFS</a>
            <button class="btn-listen" aria-label="Listen to GeekFon Radio" onclick="window.open('https://lesaruss.ai/geekfon','_blank')">Listen Now</button>
          </div>
        </div>

      </div>

    </div>
  </div>

    <iframe
      class="fs-iframe"
      id="fsIframe"
      src="geekfon-homepage-v3.html"
      title="GeekFon Society â full view"
    ></iframe>
  </div>

  <script>
    /* ---- Fon color cycling ---- */
    const fonColors = ['#e84d1a','#ff6eb4','#e94f8a','#00cfe8','#2ec4b6','#ff9f1c','#7fb069','#c0392b','#8e44ad','#c8922a'];
    let fi = 0;
    const heroFon = document.getElementById('heroFon');
    heroFon.style.color = fonColors[0];
    setInterval(() => { fi = (fi+1) % fonColors.length; heroFon.style.color = fonColors[fi]; }, 1600);

    /* ---- Phone bezel: open full page ---- */
    const phoneBez = document.getElementById('phoneBez');
    phoneBez.addEventListener('click', () => window.open('geekfon-homepage-v3.html', '_blank', 'noopener'));
    phoneBez.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.open('geekfon-homepage-v3.html', '_blank', 'noopener'); } });
  </script>
</body>
</html>
